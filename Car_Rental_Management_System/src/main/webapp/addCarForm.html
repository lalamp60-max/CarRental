
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Add New Car</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: linear-gradient(135deg,#141e30,#243b55);
    min-height: 100vh;
}

.navbar {
    background: #101d30;
    padding: 20px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navbar h2 {
    color: white;
    margin: 0;
}

.navbar a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
}

.container {
    display: flex;
    justify-content: center;
    padding: 45px 15px;
}

.form-box {
    background: white;
    width: 480px;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.form-box h1 {
    text-align: center;
    color: #172a45;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    color: #333;
}

input, select {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

input:focus, select:focus {
    outline: none;
    border-color: #ed5500;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    background: #ed5500;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #c43d00;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #ed5500;
    text-decoration: none;
}

</style>

</head>

<body>

<div class="navbar">

<h2>Car Rental Admin</h2>

<div>
<a href="admin-dashboard.jsp">Dashboard</a>
<a href="ViewCarServlet">View Cars</a>
</div>

</div>

<div class="container">

<div class="form-box">

<h1>Add New Car</h1>

<p class="subtitle">
Enter the details of the new vehicle
</p>

<form action="AddCarServlet" method="post">

<label>Car Make</label>

<input type="text"
name="make"
placeholder="Example: Toyota"
required
maxlength="50">

<label>Car Model</label>

<input type="text"
name="model"
placeholder="Example: Innova Crysta"
required
maxlength="50">

<label>Manufacturing Year</label>

<input type="number"
name="year"
placeholder="Example: 2024"
min="1900"
max="2100"
required>

<label>Rental Rate Per Day (Rs.)</label>

<input type="number"
name="rental_rate_per_day"
placeholder="Example: 2500"
min="0.01"
step="0.01"
required>

<label>Availability Status</label>

<select name="availability_status" required>

<option value="">Select Availability</option>

<option value="Available">Available</option>

<option value="Rented">Rented</option>

</select>

<button type="submit">
Add Car
</button>

</form>

<a href="admin-dashboard.jsp" class="back">
← Back to Admin Dashboard
</a>

</div>

</div>

</body>
</html>
