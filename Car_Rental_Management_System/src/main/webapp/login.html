<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>User Login | Car Rental</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg,#141e30,#243b55);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: white;
    width: 400px;
    padding: 40px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

h1 {
    text-align: center;
    color: #172a45;
}

label {
    display: block;
    margin-top: 20px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    background: #ed5500;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #c43d00;
}

.links {
    text-align: center;
    margin-top: 22px;
}

a {
    color: #ed5500;
    text-decoration: none;
    font-weight: bold;
}

.message {
    text-align: center;
    color: green;
    font-weight: bold;
}

</style>

</head>

<body>

<div class="login-box">

    <h1>User Login</h1>

    <p style="text-align:center;color:#777;">
        Login to Car Rental System
    </p>

    <form action="UserLoginServlet" method="post">

        <label>Roll Number</label>

        <input type="text"
               name="roll_no"
               placeholder="Enter Roll Number"
               required>

        <label>Password</label>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <button type="submit">
            Login
        </button>

    </form>

  

    <div class="links">

        <p>
            New User?
            <a href="register.jsp">Create Account</a>
        </p>

        <a href="index.jsp">Back to Home</a>

    </div>

</div>

</body>

</html>
